<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hotel_bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121520" />
      <stop offset="100%" stop-color="#0A0D15" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#hotel_bg3)" />

  <!-- Window Header Bar (Localhost) -->
  <rect x="40" y="30" width="720" height="44" rx="8" fill="#1C2130" />
  <circle cx="65" cy="52" r="5" fill="#FF5F56" />
  <circle cx="82" cy="52" r="5" fill="#FFBD2E" />
  <circle cx="99" cy="52" r="5" fill="#27C93F" />
  <text x="130" y="56" fill="#A0A0B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Swagger UI API Documentation (localhost:3000/api/docs)</text>
  <rect x="625" y="42" width="120" height="20" rx="4" fill="#85EA2D" fill-opacity="0.2" />
  <text x="640" y="56" fill="#85EA2D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">● SWAGGER 3.0</text>

  <!-- Left: RESTful Endpoint Explorer -->
  <rect x="40" y="95" width="450" height="365" rx="12" fill="#171C2B" stroke="#262D42" stroke-width="1.5" />
  <text x="65" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Production REST API Endpoints</text>
  <text x="65" y="148" fill="#8E8EA0" font-family="sans-serif" font-size="11">Protected with Passport JWT Strategy &amp; Custom RolesGuard</text>

  <!-- Endpoint 1: Auth POST -->
  <g transform="translate(65, 175)">
    <rect width="400" height="44" rx="6" fill="#1F2538" stroke="#49CC90" stroke-width="1" />
    <rect x="10" y="10" width="60" height="24" rx="4" fill="#49CC90" />
    <text x="40" y="26" text-anchor="middle" fill="#141418" font-family="sans-serif" font-size="11" font-weight="800">POST</text>
    <text x="85" y="27" fill="#FFFFFF" font-family="monospace" font-size="12">/api/auth/login</text>
    <text x="385" y="27" text-anchor="end" fill="#8E8EA0" font-family="sans-serif" font-size="10">JWT Generation</text>
  </g>

  <!-- Endpoint 2: Rooms GET (Cached) -->
  <g transform="translate(65, 230)">
    <rect width="400" height="44" rx="6" fill="#1F2538" stroke="#61AFFE" stroke-width="1" />
    <rect x="10" y="10" width="60" height="24" rx="4" fill="#61AFFE" />
    <text x="40" y="26" text-anchor="middle" fill="#141418" font-family="sans-serif" font-size="11" font-weight="800">GET</text>
    <text x="85" y="27" fill="#FFFFFF" font-family="monospace" font-size="12">/api/rooms</text>
    <rect x="235" y="12" width="70" height="20" rx="4" fill="#5A7ACD" fill-opacity="0.25" />
    <text x="270" y="26" text-anchor="middle" fill="#5A7ACD" font-family="sans-serif" font-size="9" font-weight="700">60s CACHE</text>
    <text x="385" y="27" text-anchor="end" fill="#8E8EA0" font-family="sans-serif" font-size="10">Public List</text>
  </g>

  <!-- Endpoint 3: Bookings POST -->
  <g transform="translate(65, 285)">
    <rect width="400" height="44" rx="6" fill="#1F2538" stroke="#49CC90" stroke-width="1" />
    <rect x="10" y="10" width="60" height="24" rx="4" fill="#49CC90" />
    <text x="40" y="26" text-anchor="middle" fill="#141418" font-family="sans-serif" font-size="11" font-weight="800">POST</text>
    <text x="85" y="27" fill="#FFFFFF" font-family="monospace" font-size="12">/api/bookings</text>
    <rect x="245" y="12" width="60" height="20" rx="4" fill="#FEB05D" fill-opacity="0.25" />
    <text x="275" y="26" text-anchor="middle" fill="#FEB05D" font-family="sans-serif" font-size="9" font-weight="700">AUTH JWT</text>
    <text x="385" y="27" text-anchor="end" fill="#8E8EA0" font-family="sans-serif" font-size="10">Create Booking</text>
  </g>

  <!-- Endpoint 4: Rooms Admin PATCH -->
  <g transform="translate(65, 340)">
    <rect width="400" height="44" rx="6" fill="#1F2538" stroke="#FCA130" stroke-width="1" />
    <rect x="10" y="10" width="60" height="24" rx="4" fill="#FCA130" />
    <text x="40" y="26" text-anchor="middle" fill="#141418" font-family="sans-serif" font-size="11" font-weight="800">PATCH</text>
    <text x="85" y="27" fill="#FFFFFF" font-family="monospace" font-size="12">/api/rooms/:id</text>
    <rect x="250" y="12" width="60" height="20" rx="4" fill="#E0234E" fill-opacity="0.25" />
    <text x="280" y="26" text-anchor="middle" fill="#FF5F7E" font-family="sans-serif" font-size="9" font-weight="700">ADMIN</text>
    <text x="385" y="27" text-anchor="end" fill="#8E8EA0" font-family="sans-serif" font-size="10">Modify Room</text>
  </g>

  <!-- Endpoint 5: Health GET -->
  <g transform="translate(65, 395)">
    <rect width="400" height="44" rx="6" fill="#1F2538" stroke="#61AFFE" stroke-width="1" />
    <rect x="10" y="10" width="60" height="24" rx="4" fill="#61AFFE" />
    <text x="40" y="26" text-anchor="middle" fill="#141418" font-family="sans-serif" font-size="11" font-weight="800">GET</text>
    <text x="85" y="27" fill="#FFFFFF" font-family="monospace" font-size="12">/api/health</text>
    <text x="385" y="27" text-anchor="end" fill="#27C93F" font-family="monospace" font-size="10">@SkipThrottle</text>
  </g>

  <!-- Right: Security & Authentication Specs -->
  <rect x="510" y="95" width="250" height="365" rx="12" fill="#171C2B" stroke="#262D42" stroke-width="1.5" />
  
  <text x="530" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Security &amp; Auth Guard</text>
  <text x="530" y="148" fill="#8E8EA0" font-family="sans-serif" font-size="11">Production hardening features</text>

  <!-- Security Card 1 -->
  <rect x="530" y="175" width="210" height="70" rx="8" fill="#1F2538" stroke="#5A7ACD" stroke-opacity="0.3" stroke-width="1" />
  <text x="545" y="200" fill="#5A7ACD" font-family="sans-serif" font-size="11" font-weight="700">Bcrypt Password Hashing</text>
  <text x="545" y="218" fill="#8E8EA0" font-family="sans-serif" font-size="10">12 Salt Rounds for all user &amp; admin accounts</text>

  <!-- Security Card 2 -->
  <rect x="530" y="260" width="210" height="70" rx="8" fill="#1F2538" stroke="#FEB05D" stroke-opacity="0.3" stroke-width="1" />
  <text x="545" y="285" fill="#FEB05D" font-family="sans-serif" font-size="11" font-weight="700">Global Throttler Limit</text>
  <text x="545" y="303" fill="#8E8EA0" font-family="sans-serif" font-size="10">60 req / 60s baseline with stricter auth guards</text>

  <!-- Security Card 3 -->
  <rect x="530" y="345" width="210" height="85" rx="8" fill="#1F2538" stroke="#27C93F" stroke-opacity="0.3" stroke-width="1" />
  <text x="545" y="370" fill="#27C93F" font-family="sans-serif" font-size="11" font-weight="700">Automated Testing</text>
  <text x="545" y="388" fill="#8E8EA0" font-family="sans-serif" font-size="10">Jest unit &amp; Supertest integration test coverage</text>
  <text x="545" y="415" fill="#27C93F" font-family="monospace" font-size="10">Tests: PASS (100% Core)</text>
</svg>
