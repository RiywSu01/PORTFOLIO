<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hotel_bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0D101A" />
    </linearGradient>
    <linearGradient id="hotel_blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5A7ACD" />
      <stop offset="100%" stop-color="#4162B5" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#hotel_bg1)" />

  <!-- Window Header Bar (Localhost) -->
  <rect x="40" y="30" width="720" height="44" rx="8" fill="#1E2333" />
  <circle cx="65" cy="52" r="5" fill="#FF5F56" />
  <circle cx="82" cy="52" r="5" fill="#FFBD2E" />
  <circle cx="99" cy="52" r="5" fill="#27C93F" />
  <text x="130" y="56" fill="#A0A0B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Hotel Booking REST API — Docker Compose Network (localhost:80 / localhost:3000)</text>
  <rect x="620" y="42" width="125" height="20" rx="4" fill="#2496ED" fill-opacity="0.2" />
  <text x="635" y="56" fill="#2496ED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">● DOCKER REVERSE PROXY</text>

  <!-- Main Docker Compose Network Box -->
  <rect x="40" y="95" width="720" height="370" rx="12" fill="#181D2C" stroke="#2B3248" stroke-width="1.5" />
  <text x="65" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Docker Compose Multi-Container Network</text>
  <text x="65" y="148" fill="#8E8EA0" font-family="sans-serif" font-size="11">Automated container orchestration with isolated bridge network and non-root execution</text>

  <!-- Step 1: External Client -->
  <g transform="translate(65, 175)">
    <rect width="130" height="180" rx="10" fill="#20263A" stroke="#2B344E" stroke-width="1" />
    <circle cx="65" cy="45" r="22" fill="#5A7ACD" fill-opacity="0.2" />
    <text x="65" y="52" text-anchor="middle" fill="#5A7ACD" font-size="20">🌐</text>
    <text x="65" y="90" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">HTTP Client</text>
    <text x="65" y="110" text-anchor="middle" fill="#8E8EA0" font-family="sans-serif" font-size="10">Web Browser /</text>
    <text x="65" y="125" text-anchor="middle" fill="#8E8EA0" font-family="sans-serif" font-size="10">Postman Suite</text>
    <rect x="15" y="140" width="100" height="24" rx="4" fill="#5A7ACD" fill-opacity="0.15" />
    <text x="65" y="156" text-anchor="middle" fill="#5A7ACD" font-family="monospace" font-size="10">Port :80 / :3000</text>
  </g>

  <!-- Arrow 1 -->
  <text x="215" y="270" fill="#5A7ACD" font-size="20" font-weight="bold">→</text>

  <!-- Step 2: Nginx Reverse Proxy Container -->
  <g transform="translate(245, 175)">
    <rect width="145" height="180" rx="10" fill="#20263A" stroke="#27C93F" stroke-width="1.2" />
    <circle cx="72" cy="45" r="22" fill="#27C93F" fill-opacity="0.2" />
    <text x="72" y="52" text-anchor="middle" fill="#27C93F" font-size="18">⚡</text>
    <text x="72" y="90" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Nginx Proxy</text>
    <text x="72" y="110" text-anchor="middle" fill="#8E8EA0" font-family="sans-serif" font-size="10">Reverse Proxy</text>
    <text x="72" y="125" text-anchor="middle" fill="#8E8EA0" font-family="sans-serif" font-size="10">Port 80 → /api/*</text>
    <rect x="15" y="140" width="115" height="24" rx="4" fill="#27C93F" fill-opacity="0.15" />
    <text x="72" y="156" text-anchor="middle" fill="#27C93F" font-family="monospace" font-size="10">Alpine Nginx</text>
  </g>

  <!-- Arrow 2 -->
  <text x="410" y="270" fill="#5A7ACD" font-size="20" font-weight="bold">→</text>

  <!-- Step 3: NestJS Backend API Container -->
  <g transform="translate(435, 175)">
    <rect width="150" height="180" rx="10" fill="#20263A" stroke="#E0234E" stroke-width="1.2" />
    <circle cx="75" cy="45" r="22" fill="#E0234E" fill-opacity="0.2" />
    <text x="75" y="52" text-anchor="middle" fill="#FF5F7E" font-size="18">🦁</text>
    <text x="75" y="90" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">NestJS 11 API</text>
    <text x="75" y="110" text-anchor="middle" fill="#8E8EA0" font-family="sans-serif" font-size="10">• In-Memory Cache</text>
    <text x="75" y="125" text-anchor="middle" fill="#8E8EA0" font-family="sans-serif" font-size="10">• Throttler Guard</text>
    <rect x="15" y="140" width="120" height="24" rx="4" fill="#E0234E" fill-opacity="0.15" />
    <text x="75" y="156" text-anchor="middle" fill="#FF5F7E" font-family="monospace" font-size="10">Prisma 7 Client</text>
  </g>

  <!-- Arrow 3 -->
  <text x="605" y="270" fill="#5A7ACD" font-size="20" font-weight="bold">→</text>

  <!-- Step 4: MySQL 8.0 Database Container -->
  <g transform="translate(625, 175)">
    <rect width="115" height="180" rx="10" fill="#20263A" stroke="#FEB05D" stroke-width="1.2" />
    <circle cx="57" cy="45" r="22" fill="#FEB05D" fill-opacity="0.2" />
    <text x="57" y="52" text-anchor="middle" fill="#FEB05D" font-size="18">🐬</text>
    <text x="57" y="90" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">MySQL 8.0</text>
    <text x="57" y="110" text-anchor="middle" fill="#8E8EA0" font-family="sans-serif" font-size="10">Port :3306</text>
    <text x="57" y="125" text-anchor="middle" fill="#8E8EA0" font-family="sans-serif" font-size="10">Named Volume</text>
    <rect x="10" y="140" width="95" height="24" rx="4" fill="#FEB05D" fill-opacity="0.15" />
    <text x="57" y="156" text-anchor="middle" fill="#FEB05D" font-family="monospace" font-size="10">Persistent</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(65, 395)">
    <rect width="210" height="34" rx="6" fill="#20263A" />
    <text x="105" y="416" text-anchor="middle" fill="#A0A8C0" font-family="sans-serif" font-size="11">Health Check: <tspan fill="#27C93F" font-weight="600">/api/health (200 OK)</tspan></text>

    <rect x="230" width="220" height="34" rx="6" fill="#20263A" />
    <text x="340" y="416" text-anchor="middle" fill="#A0A8C0" font-family="sans-serif" font-size="11">Cache Strategy: <tspan fill="#5A7ACD" font-weight="600">In-Memory (60s TTL)</tspan></text>

    <rect x="470" width="210" height="34" rx="6" fill="#20263A" />
    <text x="575" y="416" text-anchor="middle" fill="#A0A8C0" font-family="sans-serif" font-size="11">Rate Limit: <tspan fill="#FEB05D" font-weight="600">60 req / 60s Global</tspan></text>
  </g>
</svg>
