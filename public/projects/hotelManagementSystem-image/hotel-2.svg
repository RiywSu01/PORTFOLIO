<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hotel_bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121622" />
      <stop offset="100%" stop-color="#0B0E17" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#hotel_bg2)" />

  <!-- Window Header Bar (Localhost) -->
  <rect x="40" y="30" width="720" height="44" rx="8" fill="#1C2130" />
  <circle cx="65" cy="52" r="5" fill="#FF5F56" />
  <circle cx="82" cy="52" r="5" fill="#FFBD2E" />
  <circle cx="99" cy="52" r="5" fill="#27C93F" />
  <text x="130" y="56" fill="#A0A0B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Hotel Booking Engine — Room Inventory &amp; Conflict-Free Booking Lifecycle</text>
  <rect x="625" y="42" width="120" height="20" rx="4" fill="#5A7ACD" fill-opacity="0.25" />
  <text x="635" y="56" fill="#5A7ACD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">● CONFLICT GUARD</text>

  <!-- Left: Room Inventory Management (Admin CRUD) -->
  <rect x="40" y="95" width="370" height="365" rx="12" fill="#171C2B" stroke="#262D42" stroke-width="1.5" />
  <text x="65" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Room Inventory Management</text>
  <text x="65" y="148" fill="#8E8EA0" font-family="sans-serif" font-size="11">Admin CRUD: Capacity, dynamic pricing, and active window</text>

  <!-- Room 101 -->
  <g transform="translate(65, 175)">
    <rect width="320" height="70" rx="8" fill="#1F2538" stroke="#5A7ACD" stroke-width="1" />
    <rect x="15" y="15" width="40" height="40" rx="6" fill="#5A7ACD" fill-opacity="0.2" />
    <text x="35" y="39" text-anchor="middle" fill="#5A7ACD" font-size="16">🛏️</text>
    <text x="68" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Deluxe Ocean Suite (Rm 101)</text>
    <text x="68" y="50" fill="#8E8EA0" font-family="sans-serif" font-size="11">Cap: 2 Guests • ฿3,200 / night</text>
    <rect x="235" y="25" width="70" height="22" rx="4" fill="#27C93F" fill-opacity="0.2" />
    <text x="270" y="40" text-anchor="middle" fill="#27C93F" font-family="sans-serif" font-size="10" font-weight="700">AVAILABLE</text>
  </g>

  <!-- Room 204 -->
  <g transform="translate(65, 260)">
    <rect width="320" height="70" rx="8" fill="#1F2538" stroke="#262D42" stroke-width="1" />
    <rect x="15" y="15" width="40" height="40" rx="6" fill="#FEB05D" fill-opacity="0.2" />
    <text x="35" y="39" text-anchor="middle" fill="#FEB05D" font-size="16">👑</text>
    <text x="68" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Executive Penthouse (Rm 204)</text>
    <text x="68" y="50" fill="#8E8EA0" font-family="sans-serif" font-size="11">Cap: 4 Guests • ฿6,500 / night</text>
    <rect x="235" y="25" width="70" height="22" rx="4" fill="#FEB05D" fill-opacity="0.2" />
    <text x="270" y="40" text-anchor="middle" fill="#FEB05D" font-family="sans-serif" font-size="10" font-weight="700">OCCUPIED</text>
  </g>

  <!-- Room 305 -->
  <g transform="translate(65, 345)">
    <rect width="320" height="70" rx="8" fill="#1F2538" stroke="#262D42" stroke-width="1" />
    <rect x="15" y="15" width="40" height="40" rx="6" fill="#A0A0B0" fill-opacity="0.2" />
    <text x="35" y="39" text-anchor="middle" fill="#A0A0B0" font-size="16">🌿</text>
    <text x="68" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Garden Standard (Rm 305)</text>
    <text x="68" y="50" fill="#8E8EA0" font-family="sans-serif" font-size="11">Cap: 2 Guests • ฿1,800 / night</text>
    <rect x="235" y="25" width="70" height="22" rx="4" fill="#27C93F" fill-opacity="0.2" />
    <text x="270" y="40" text-anchor="middle" fill="#27C93F" font-family="sans-serif" font-size="10" font-weight="700">AVAILABLE</text>
  </g>

  <!-- Right: Booking Conflict Detection & State Workflow -->
  <rect x="430" y="95" width="330" height="365" rx="12" fill="#171C2B" stroke="#262D42" stroke-width="1.5" />
  <text x="455" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Conflict-Free Booking Flow</text>
  <text x="455" y="148" fill="#8E8EA0" font-family="sans-serif" font-size="11">Automated date overlap validation &amp; event notifications</text>

  <!-- State Flow Progression -->
  <!-- State 1: Create / Pending -->
  <g transform="translate(455, 175)">
    <rect width="280" height="46" rx="6" fill="#1F2538" stroke="#FEB05D" stroke-width="1" />
    <text x="20" y="28" fill="#FEB05D" font-family="sans-serif" font-size="12" font-weight="700">1. Status: PENDING</text>
    <text x="260" y="28" text-anchor="end" fill="#8E8EA0" font-family="sans-serif" font-size="10">Check-in / Check-out Validated</text>
  </g>

  <!-- Flow line 1 -->
  <line x1="595" y1="221" x2="595" y2="236" stroke="#5A7ACD" stroke-width="2" stroke-dasharray="3,3" />

  <!-- State 2: Approved -->
  <g transform="translate(455, 236)">
    <rect width="280" height="46" rx="6" fill="#1F2538" stroke="#5A7ACD" stroke-width="1" />
    <text x="20" y="28" fill="#5A7ACD" font-family="sans-serif" font-size="12" font-weight="700">2. Status: APPROVED</text>
    <text x="260" y="28" text-anchor="end" fill="#8E8EA0" font-family="sans-serif" font-size="10">Overlap Conflict = 0 (Passed)</text>
  </g>

  <!-- Flow line 2 -->
  <line x1="595" y1="282" x2="595" y2="297" stroke="#27C93F" stroke-width="2" stroke-dasharray="3,3" />

  <!-- State 3: Paid & Event Notification -->
  <g transform="translate(455, 297)">
    <rect width="280" height="46" rx="6" fill="#1F2538" stroke="#27C93F" stroke-width="1" />
    <text x="20" y="28" fill="#27C93F" font-family="sans-serif" font-size="12" font-weight="700">3. Status: PAID</text>
    <text x="260" y="28" text-anchor="end" fill="#8E8EA0" font-family="sans-serif" font-size="10">Transaction Confirmed</text>
  </g>

  <!-- Notification Dispatch Box -->
  <g transform="translate(455, 360)">
    <rect width="280" height="75" rx="8" fill="#1F2538" stroke="#5A7ACD" stroke-opacity="0.3" stroke-width="1" />
    <text x="15" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">📢 Event-Driven Notification</text>
    <text x="15" y="44" fill="#8E8EA0" font-family="sans-serif" font-size="10">@nestjs/event-emitter: 'booking.created'</text>
    <text x="15" y="60" fill="#5A7ACD" font-family="monospace" font-size="10">Persists unread alert to user notification table</text>
  </g>
</svg>
